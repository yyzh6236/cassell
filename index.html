<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UR · 氪金抽数计算器</title>
  <meta name="description" content="UR 通用氪金抽数计算器：勾选来源、调节礼包次数，实时估算总抽数与花费。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">UR · General Plan</div>
      <h1>氪金抽数计算器</h1>
      <p>勾选免费来源，调节礼包购买次数，实时看总抽数与总花费。轻松规划你的抽卡方案。</p>
    </header>

    <p class="save-status" id="save-status" role="status"></p>
    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>抽数</h2>

        </div>
        <div class="toolbar">
          <button type="button" id="btn-all-free">全选免费</button>
          <button type="button" id="btn-clear-free" class="ghost">清空免费</button>
          <button type="button" id="btn-clear-paid" class="ghost">清空礼包</button>
          <button type="button" id="btn-reset" class="ghost">全部重置</button>
        </div>
        <div id="sources"></div>
      </section>

      <aside class="summary">
        <section class="panel" id="summary">
          <div class="panel-head">
            <h2>方案合计</h2>
            <div class="hint">随勾选即时更新</div>
          </div>
          <div class="stats">
            <div class="stat wide">
              <label>总计抽数</label>
              <strong id="total-pulls">0</strong>
            </div>
            <div class="stat">
              <label>总计花费</label>
              <strong id="total-cost">¥0</strong>
            </div>
            <div class="stat">
              <label>单抽均价</label>
              <strong id="unit-price">—</strong>
            </div>
          </div>
          <div class="section-title" style="padding-top:0">累计抽数奖励</div>
          <div class="milestones" id="milestones"></div>
          <p class="gap-note" id="gap-note"></p>
        </section>

        <section class="panel ref-panel">
          <div class="panel-head">
            <h2>培养星级奖励</h2>
            <div class="hint">参考 · 不参与计算</div>
          </div>
          <table class="ref-table">
            <thead>
              <tr>
                <th class="lv">觉醒</th>
                <th class="reward">奖励</th>
                <th class="lv split">超限</th>
                <th class="reward">奖励</th>
              </tr>
            </thead>
            <tbody id="cultivate-rewards"></tbody>
          </table>
          <div class="ref-foot">「？」表示奖励暂未确认。</div>
        </section>
      </aside>
    </div>


  </div>

  <a class="mobile-summary" href="#summary" aria-label="查看方案合计与累计奖励">
    <span>总计 <strong id="mobile-pulls">0</strong> 抽</span>
    <span id="mobile-cost">¥0</span>
    <span class="mobile-details">查看合计 ↑</span>
  </a>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
